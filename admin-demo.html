function switchPage(p){if(!navNames[p])return;page=p;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('sidebar').classList.remove('open');render();if(location.hash!=='#'+p)history.replaceState(null,'','#'+p);window.scrollTo({top:0,behavior:'smooth'})}
function render(){const s=currentStats();
 if(page==='overview'){view.innerHTML=head(`<button class="btn" id="exportOverview">Exportar CSV ↗</button><button class="btn btn-primary" id="goGuests">Gerir convidados →</button>`)+`<div class="kpis"><div class="kpi"><span class="kpi-icon">♧</span><div class="kpi-label">Convidados adultos</div><div class="kpi-number">${s.total}</div><div class="kpi-caption">Dados fictícios desta demonstração</div></div><div class="kpi"><span class="kpi-icon">✓</span><div class="kpi-label">Presenças confirmadas</div><div class="kpi-number">${s.yes+s.children}</div><div class="kpi-caption">${s.yes} adultos e ${s.children} crianças</div></div><div class="kpi"><span class="kpi-icon">◷</span><div class="kpi-label">Por responder</div><div class="kpi-number">${s.pending}</div><div class="kpi-caption">Ainda sem confirmação</div></div><div class="kpi"><span class="kpi-icon">✳</span><div class="kpi-label">Restrições alimentares</div><div class="kpi-number">${s.allergies}</div><div class="kpi-caption">Alertas alimentares fictícios</div></div></div><div class="grid-two"><article class="panel"><div class="panel-title"><h2>Estado das confirmações</h2><span>Adultos · demonstração</span></div>${[['Confirmados',s.yes],['Pendentes',s.pending],['Não vão',s.no]].map((x,i)=>`<div class="progress-row"><span>${x[0]}</span><div class="progress"><div style="width:${s.total?(100*x[1]/s.total).toFixed(1):0}%;${i===1?'background:#aebba5':i===2?'background:#d9e0d4':''}"></div></div><strong>${x[1]}</strong></div>`).join('')}<div class="settings-note" style="margin-top:27px">O prazo para confirmar presença termina a <strong>1 de fevereiro de 2027</strong>.</div></article><article class="panel"><div class="panel-title"><h2>Atividade recente</h2><span>Simulação</span></div><div class="activity-list">${lastActivity.slice(0,5).map(a=>`<div class="activity-row"><span class="activity-dot"></span><div><strong>${clean(a.label)}</strong><br>${clean(a.detail)}</div></div>`).join('')}</div></article></div><p class="note">O painel usa convidados inventados: não contém a lista verdadeira nem grava alterações no servidor.</p>`;
  document.getElementById('goGuests').onclick=()=>switchPage('guests');document.getElementById('exportOverview').onclick=exportCSV;return;}
 if(page==='guests'){view.innerHTML=head(`<button class="btn" id="downloadCsv">Exportar CSV ↗</button><button class="btn btn-primary" id="addGuest">+ Adicionar convidado</button>`)+`<div class="toolbar"><label class="search"><input id="guestSearch" placeholder="Pesquisar convidado..." value="${clean(guestFilters.q)}" aria-label="Pesquisar convidado"></label><select id="filterSide" class="filter" aria-label="Filtrar lado"><option value="all">Ambos os lados</option><option value="Hugo">Hugo</option><option value="Márcia">Márcia</option></select><select id="filterType" class="filter" aria-label="Filtrar tipo"><option value="all">Todos</option><option value="Família">Família</option><option value="Amigos">Amigos</option></select><select id="filterStatus" class="filter" aria-label="Filtrar estado"><option value="all">Todos os estados</option><option value="yes">Confirmados</option><option value="pending">Pendentes</option><option value="no">Não vão</option></select></div><div class="panel" style="padding:6px 10px"><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Convidado</th><th>Lado</th><th>Tipo</th><th>Resposta</th><th>Mesa</th><th>Alimentação</th><th></th></tr></thead><tbody id="guestRows"></tbody></table></div></div><p id="rowCount" class="note"></p>`;
  for(const [id,value] of [['filterSide',guestFilters.side],['filterType',guestFilters.type],['filterStatus',guestFilters.status]])document.getElementById(id).value=value;
  document.getElementById('guestSearch').oninput=e=>{guestFilters.q=e.target.value;updateGuestRows()};for(const [id,prop] of [['filterSide','side'],['filterType','type'],['filterStatus','status']])document.getElementById(id).onchange=e=>{guestFilters[prop]=e.target.value;updateGuestRows()};
  document.getElementById('downloadCsv').onclick=exportCSV;document.getElementById('addGuest').onclick=()=>editGuest(null);updateGuestRows();return;}
 if(page==='children'){view.innerHTML=head()+`<div class="settings-note"><strong>Regra definida:</strong> familiares do Hugo podem selecionar apenas crianças da lista do Hugo; familiares da Márcia, apenas crianças da lista da Márcia. Os amigos não podem adicionar crianças, e cada criança só pode ter uma confirmação ativa.</div><div class="toolbar"><select id="filterChildSide" class="filter" aria-label="Filtrar crianças"><option value="all">Ambos os lados</option><option>Hugo</option><option>Márcia</option></select></div><div class="panel" style="padding:6px 10px"><div class="data-table-wrap"><table class="data-table" style="min-width:590px"><thead><tr><th>Criança</th><th>Família</th><th>Confirmação</th><th>Confirmada por</th><th>Mesas</th><th></th></tr></thead><tbody id="childRows"></tbody></table></div></div>`;document.getElementById('filterChildSide').value=childSide;document.getElementById('filterChildSide').onchange=e=>{childSide=e.target.value;updateChildRows()};updateChildRows();return;}
 if(page==='seating'){view.innerHTML=head(`<button class="btn" id="resetSeating">Limpar lugares (demo)</button>`)+`<div class="settings-note"><strong>Privado dos noivos.</strong> Este plano não aparece no site público. Arrastem os nomes entre mesas no computador, ou usem os seletores no telemóvel. Só convidados com presença confirmada podem ocupar uma mesa.</div><div class="seating-layout"><div class="table-grid" id="tableGrid"></div><aside class="unassigned-panel"><h3>Por distribuir</h3><p>Convidados confirmados sem mesa atribuída.</p><div class="unassigned-list" id="unassignedList"></div></aside></div>`;document.getElementById('resetSeating').onclick=()=>{guests.forEach(g=>g.table=null);children.forEach(c=>c.table=null);render();notify('Distribuição das mesas reiniciada nesta demonstração.')};renderSeating();return;}
 if(page==='notifications'){view.innerHTML=head(`<button class="btn btn-primary" id="simulateNotice">+ Simular aviso</button>`)+`<div class="panel"><div class="panel-title"><h2>Histórico de notificações</h2><span>Nenhuma mensagem real enviada</span></div><div class="notification-list">${notices.map(n=>`<div class="notification"><div><strong>${clean(n.title)}</strong><p>${clean(n.detail)}</p></div><span class="tag">${clean(n.when)}</span></div>`).join('')}</div></div><div class="callout">Na versão definitiva, Hugo e Márcia poderão receber alertas de confirmações e alterações, e os convidados poderão receber mensagens automáticas. Esta demonstração não envia emails nem SMS.</div>`;document.getElementById('simulateNotice').onclick=()=>{notices.unshift({title:'Nova confirmação (simulada)',detail:'Exemplo de aviso que os noivos receberiam ao confirmar um convidado.',when:'Simulação'});addActivity('Notificação','aviso simulado no painel');render();notify('Aviso simulado — nenhum email enviado.')};return;}
 if(page==='settings'){view.innerHTML=head()+`<div class="panel"><div class="panel-title"><h2>Regras do casamento</h2><span>Definidas para o futuro sistema</span></div><div class="setting-list"><div class="setting-row"><div><strong>Prazo de confirmação</strong><p>Até 1 de fevereiro de 2027.</p></div><span class="tag">01.02.2027</span></div><div class="setting-row"><div><strong>Pesquisa de convidados</strong><p>O nome só aparece como sugestão após o convidado começar a escrever.</p></div><span class="tag">Público</span></div><div class="setting-row"><div><strong>Crianças</strong><p>Permitidas apenas para familiares, dentro da lista do lado respetivo.</p></div><span class="tag">Restrito</span></div><div class="setting-row"><div><strong>Plano de mesas</strong><p>Exclusivo dos noivos, sem acesso para convidados.</p></div><span class="tag">Privado</span></div><div class="setting-row"><div><strong>Respostas alimentares</strong><p>Preferências e alergias associadas ao convidado; acesso autorizado apenas.</p></div><span class="tag">Privado</span></div><div class="setting-row"><div><strong>Notificações</strong><p>Alertas aos noivos e mensagens aos convidados na versão definitiva.</p></div><span class="tag">Por ligar</span></div></div></div><div class="callout"><strong>O que falta para ativar esta área:</strong> um projeto de base de dados separado do da Love Essences, autenticação dos dois noivos, políticas de acesso (RLS), API segura para o RSVP, envio de emails e testes antes de importar os 116 registos.</div>`;return;}
}
function updateGuestRows(){const filtered=guests.filter(g=>(guestFilters.side==='all'||g.side===guestFilters.side)&&(guestFilters.type==='all'||g.type===guestFilters.type)&&(guestFilters.status==='all'||g.status===guestFilters.status)&&norm(g.name).includes(norm(guestFilters.q)));document.getElementById('guestRows').innerHTML=filtered.length?filtered.map(g=>`<tr><td><div class="guest-name">${clean(g.name)}</div><div class="guest-sub">ID ${clean(g.id)}</div></td><td>${clean(g.side)}</td><td>${clean(g.type)}</td><td>${statusBadge(g.status)}</td><td>${g.table?clean(tables.find(t=>t.id===g.table)?.name||g.table):'—'}</td><td>${clean(g.diet)}${g.allergies?'<span style="color:#ae6653"> • !</span>':''}</td><td><button class="text-btn" data-edit="${clean(g.id)}">Editar</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty-state">Não foram encontrados convidados.</div></td></tr>`;document.getElementById('rowCount').textContent=`${filtered.length} de ${guests.length} convidados adultos (dados fictícios).`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editGuest(b.dataset.edit))}
function updateChildRows(){const filtered=children.filter(c=>childSide==='all'||c.side===childSide);document.getElementById('childRows').innerHTML=filtered.map(c=>`<tr><td><div class="guest-name">${clean(c.name)}</div><div class="guest-sub">ID ${clean(c.id)}</div></td><td>${clean(c.side)}</td><td>${statusBadge(c.status)}</td><td>${clean(guests.find(g=>g.id===c.adult)?.name||'—')}</td><td>${clean(c.table||'—')}</td><td><button class="text-btn" data-child-edit="${clean(c.id)}">Editar</button></td></tr>`).join('');document.querySelectorAll('[data-child-edit]').forEach(b=>b.onclick=()=>editChild(b.dataset.childEdit))}
function showModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;modal.hidden=false}
function closeModal(){modal.hidden=true;document.getElementById('modalBody').replaceChildren()}
function editGuest(id){const existing=id?guests.find(g=>g.id===id):null;const x=existing||{name:'',side:'Hugo',type:'Família',status:'pending',diet:'Nenhuma',allergies:'',table:null,email:''};showModal(existing?'Editar convidado':'Adicionar convidado fictício',`<form id="guestEditForm"><div class="form-grid"><div class="field full"><label for="editName">Nome</label><input id="editName" value="${clean(x.name)}" required maxlength="80" placeholder="Nome de demonstração"></div><div class="field"><label for="editSide">Lado</label><select id="editSide"><option>Hugo</option><option>Márcia</option></select></div><div class="field"><label for="editType">Categoria</label><select id="editType"><option>Família</option><option>Amigos</option></select></div><div class="field"><label for="editStatus">Presença</label><select id="editStatus"><option value="pending">Pendente</option><option value="yes">Confirmado</option><option value="no">Não vai</option></select></div><div class="field"><label for="editDiet">Preferência alimentar</label><select id="editDiet"><option>Nenhuma</option><option>Vegetariano</option><option>Vegan</option></select></div><div class="field full"><label for="editAllergies">Alergias ou intolerâncias (fictícias)</label><textarea id="editAllergies" placeholder="Apenas dados inventados nesta demo">${clean(x.allergies)}</textarea></div></div><div class="detail-actions"><button class="btn" type="button" id="cancelGuest">Cancelar</button><button class="btn btn-primary" type="submit">Guardar na demonstração</button></div></form><p class="note">Alterações em memória. Ao recarregar a página, voltam os dados iniciais.</p>`);for(const [id,value] of [['editSide',x.side],['editType',x.type],['editStatus',x.status],['editDiet',x.diet]])document.getElementById(id).value=value;document.getElementById('cancelGuest').onclick=closeModal;document.getElementById('guestEditForm').onsubmit=e=>{e.preventDefault();const n=document.getElementById('editName').value.trim();if(!n)return;const status=document.getElementById('editStatus').value;const val={name:n,side:document.getElementById('editSide').value,type:document.getElementById('editType').value,status,diet:document.getElementById('editDiet').value,allergies:document.getElementById('editAllergies').value.trim()};if(existing){Object.assign(existing,val);if(status!=='yes')existing.table=null; if(existing.type!=='Família'){children.filter(c=>c.adult===existing.id).forEach(c=>{c.adult=null;c.status='pending';c.table=null})} else children.filter(c=>c.adult===existing.id&&c.side!==existing.side).forEach(c=>{c.adult=null;c.status='pending';c.table=null})}else guests.push({...val,id:'demo-g'+(Date.now()%1000000),table:null});addActivity(n,'dados atualizados na demonstração');closeModal();render();notify('Dados de demonstração atualizados.')};}
function editChild(id){const c=children.find(x=>x.id===id);if(!c)return;const eligible=guests.filter(g=>g.side===c.side&&g.type==='Família');showModal('Editar criança',`<div class="detail-heading"><div><h3>${clean(c.name)}</h3><div class="detail-dim">Família do lado de ${c.side}</div></div>${statusBadge(c.status)}</div><form id="childEditForm"><div class="form-grid"><div class="field full"><label for="childAdult">Familiar responsável pela confirmação</label><select id="childAdult"><option value="">Nenhum</option>${eligible.map(g=>`<option value="${clean(g.id)}">${clean(g.name)}${g.status!=='yes'?' (presença não confirmada)':''}</option>`).join('')}</select></div><div class="field full"><label for="childStatus">Presença da criança</label><select id="childStatus"><option value="pending">Pendente</option><option value="yes">Confirmada</option><option value="no">Não vai</option></select></div></div><div class="detail-actions"><button class="btn" type="button" id="cancelChild">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div></form>`);document.getElementById('childAdult').value=c.adult||'';document.getElementById('childStatus').value=c.status;document.getElementById('cancelChild').onclick=closeModal;document.getElementById('childEditForm').onsubmit=e=>{e.preventDefault();const adultId=document.getElementById('childAdult').value;const status=document.getElementById('childStatus').value;const adult=guests.find(g=>g.id===adultId);if(status==='yes'&&(!adult||adult.side!==c.side||adult.type!=='Família'||adult.status!=='yes')){notify('Para confirmar esta criança, escolhe um familiar do mesmo lado com presença confirmada.');return}c.adult=adultId||null;c.status=status;if(status!=='yes')c.table=null;addActivity(c.name,'resposta da criança atualizada na demonstração');closeModal();render();notify('Criança atualizada — sem guardar no servidor.')};}
const allSeated=()=>[...guests.filter(g=>g.status==='yes'),...children.filter(c=>c.status==='yes')];
function tableFull(tid){const t=tables.find(x=>x.id===tid);return t&&allSeated().filter(x=>x.table===tid).length>=t.capacity}
function assignSeat(id,target){const g=allSeated().find(x=>x.id===id);if(!g)return notify('Apenas convidados confirmados podem ser distribuídos.');if(target&&g.table!==target&&tableFull(target))return notify('Esta mesa já está cheia.');g.table=target||null;renderSeating()}
function renderSeating(){const grid=document.getElementById('tableGrid'),unassigned=document.getElementById('unassignedList');if(!grid||!unassigned)return;grid.innerHTML=tables.map(t=>{const occupants=allSeated().filter(x=>x.table===t.id);return `<div class="table-card" data-table="${t.id}"><div class="table-head"><h3>${clean(t.name)}</h3><span>${occupants.length}/${t.capacity} lugares</span></div><div class="seat-chips">${occupants.map(x=>`<div class="guest-chip" draggable="true" data-drag="${clean(x.id)}">${clean(x.name)} <button type="button" data-unassign="${clean(x.id)}" title="Retirar desta mesa" aria-label="Retirar ${clean(x.name)} desta mesa">×</button></div>`).join('')||'<span style="font-size:11px;color:#9ba195">Arrasta convidados para esta mesa</span>'}</div></div>`}).join('');const noTable=allSeated().filter(x=>!x.table);unassigned.innerHTML=noTable.length?noTable.map(x=>`<div class="unassigned-row" draggable="true" data-drag="${clean(x.id)}"><strong>${clean(x.name)}</strong><label class="table-assignment"><select data-assign="${clean(x.id)}" aria-label="Atribuir mesa a ${clean(x.name)}"><option value="">Escolher mesa...</option>${tables.map(t=>`<option value="${t.id}" ${tableFull(t.id)?'disabled':''}>${clean(t.name)}</option>`).join('')}</select></label></div>`).join(''):'<p class="empty-state">Todos os confirmados já têm mesa.</p>';
 document.querySelectorAll('[data-drag]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='move'})});document.querySelectorAll('[data-table]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover')});el.addEventListener('dragleave',()=>el.classList.remove('dragover'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');assignSeat(e.dataTransfer.getData('text/plain'),el.dataset.table)})});document.querySelectorAll('[data-unassign]').forEach(el=>el.onclick=()=>assignSeat(el.dataset.unassign,null));document.querySelectorAll('[data-assign]').forEach(el=>el.onchange=()=>assignSeat(el.dataset.assign,el.value));}
function exportCSV(){const rows=[['ID','Nome','Lado','Categoria','Presença','Preferência alimentar','Alergias fictícias','Mesa'],...guests.map(g=>[g.id,g.name,g.side,g.type,labels[g.status],g.diet,g.allergies,g.table||''])];const csv='\uFEFF'+rows.map(cols=>cols.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='convidados-exemplo-hugo-marcia.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify('CSV de demonstração exportado.');}
document.querySelectorAll('.nav-btn').forEach(el=>el.onclick=()=>switchPage(el.dataset.page));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('closeModal').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});
const start=location.hash.slice(1);switchPage(navNames[start]?start:'overview');
})();
</script>
</body>
